# Local Postgres and object storage for development (see README "Start the database")
# Passwords and keys come from the git-ignored .env next to this file (copy .env.example)
services:
  postgres:
    # Matches the Neon project's major version (Neon's default for new projects is 18)
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KILN_MIGRATOR_PASSWORD: ${KILN_MIGRATOR_PASSWORD:?Set KILN_MIGRATOR_PASSWORD in .env}
      KILN_APP_PASSWORD: ${KILN_APP_PASSWORD:?Set KILN_APP_PASSWORD in .env}
    ports:
      # Only reachable from this machine
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep their data under /var/lib/postgresql (not /var/lib/postgresql/data)
      - postgres-data:/var/lib/postgresql
      # Runs once, when the data volume is first created
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kiln"]
      interval: 5s
      timeout: 5s
      retries: 10
      # After an unclean shutdown (such as Docker stopping), Postgres syncs every data file before it
      # accepts connections, which can take minutes; failed checks in this time don't count
      start_period: 5m
      start_interval: 2s

  # S3-compatible object storage for uploads such as tile graphics (STORAGE_* in server/.env).
  # Production uses any S3-compatible service instead
  storage:
    # Runs `weed mini` (master, volume, filer and S3 in one process); the S3 API refuses requests
    # without these keys
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Set STORAGE_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Set STORAGE_SECRET_ACCESS_KEY in .env}
    ports:
      # The S3 API, only reachable from this machine
      - "127.0.0.1:${STORAGE_PORT:-8333}:8333"
    volumes:
      - storage-data:/data

  # Catches every email the server sends (SMTP_URL in server/.env), so nothing reaches a real inbox.
  # Read them at http://127.0.0.1:8025. Production sends through a real SMTP service instead
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      # SMTP and the web inbox, only reachable from this machine
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  postgres-data:
  storage-data:
