# Dependabot version updates: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# Security updates are turned on separately, in the repository's Settings > Advanced Security
version: 2
updates:
  # One entry covers every workspace: npm workspaces share the root package-lock.json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Waits before proposing a new release, so a compromised or broken publish is likely caught
    # and pulled first. Security updates ignore this
    cooldown:
      default-days: 7
    # typescript-eslint supports a limited range of TypeScript versions, so a new TypeScript major
    # waits until typescript-eslint supports it and is updated by hand
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # colyseus and the @colyseus/* packages must stay on matching versions
      colyseus:
        patterns:
          - colyseus
          - "@colyseus/*"
      # Bundles the routine minor and patch updates into one PR each; majors still get their own
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # The Postgres image in docker-compose.yml. Its major version must match the Neon project's,
  # so major updates are ignored and made by hand alongside a Neon upgrade
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
