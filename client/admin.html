<!doctype html>
<html lang="en">
	<head>
		<!-- include head.html -->
		<title data-message="admin.home.title" data-translation-context="The browser tab's title for the admin page that links to the site admins' tools, before the game engine's name">Site Admin</title>
		<link rel="stylesheet" href="/src/admin.scss" />
	</head>
	<body>
		<main>
			<section class="admin-page">
				<header class="toolbar">
					<!-- include site-name.html -->
					<h1 data-message="admin.home.heading" data-translation-context="Heading of the admin page that links to the site admins' tools: the site settings, the list of sessions and the list of players">Site Admin</h1>
					<!-- include account.html -->
				</header>
				<div class="admin-body">
					<!-- include admin-refusal.html -->
					<p id="admin-loading" class="admin-loading" data-message="page.loading" data-translation-context="Shown while a page or part of one loads, such as the site settings, the choices in Create Character, an area in the editor, or a universe's page">Loading...</p>
					<ul id="admin-content" class="admin-tools" hidden>
						<li>
							<a class="panel admin-tool" href="/admin/settings" data-shortcut="Alt+G" aria-describedby="admin-tool-settings-hint">
								<span class="admin-tool-name" data-message="admin.tools.settings" data-translation-context="Link on the admin page to the site settings, such as whether players can create universes"><!-- icon ph:gear -->Settings</span>
								<span id="admin-tool-settings-hint" class="hint" data-message="admin.tools.settingsHint" data-translation-context="Under the link to the site settings on the admin page">Creating universes, last rites, the footer's social sites and the privacy policy's contact.</span>
							</a>
						</li>
						<li>
							<a class="panel admin-tool" href="/admin/sessions" data-shortcut="Alt+O" aria-describedby="admin-tool-sessions-hint">
								<span class="admin-tool-name" data-message="admin.tools.sessions" data-translation-context="Link on the admin page to the list of login sessions"><!-- icon ph:devices -->Sessions</span>
								<span id="admin-tool-sessions-hint" class="hint" data-message="admin.tools.sessionsHint" data-translation-context="Under the link to the list of login sessions on the admin page">Every browser logged in to the site, and which are connected now.</span>
							</a>
						</li>
						<li>
							<a class="panel admin-tool" href="/admin/players" data-shortcut="Alt+P" aria-describedby="admin-tool-players-hint">
								<span class="admin-tool-name" data-message="admin.tools.players" data-translation-context="Link on the admin page to the list of every player account"><!-- icon ph:users -->Players</span>
								<span id="admin-tool-players-hint" class="hint" data-message="admin.tools.playersHint" data-translation-context="Under the link to the list of player accounts on the admin page">Every account: how it logs in, when it last did, and who is a server admin.</span>
							</a>
						</li>
					</ul>
				</div>
			</section>
		</main>
		<!-- include footer.html -->
		<!-- include accessibility.html -->
		<script type="module" src="/src/admin.ts"></script>
	</body>
</html>
