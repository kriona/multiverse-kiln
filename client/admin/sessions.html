<!doctype html>
<html lang="en">
	<head>
		<!-- include head.html -->
		<title data-message="admin.sessions.title" data-translation-context="The browser tab's title for the admin page listing the browsers logged in to the site, before the game engine's name">Sessions</title>
		<link rel="stylesheet" href="/src/admin.scss" />
	</head>
	<body>
		<main>
			<section class="admin-page">
				<header class="toolbar">
					<!-- include site-name.html -->
					<!-- include admin-crumb.html -->
					<h1 data-message="admin.sessions.heading" data-translation-context="Heading of the admin page listing the browsers logged in to the site">Sessions</h1>
					<!-- include account.html -->
				</header>
				<div class="admin-body admin-body-wide">
					<!-- include admin-refusal.html -->
					<div id="admin-content" class="panel">
						<div class="hint" data-message="admin.sessions.hint" data-translation-context="Explains the admin page listing login sessions, above the list">Each browser logged in to the site.</div>
						<div class="filters">
							<input id="session-search" type="search" placeholder="Search by name or username" aria-label="Search sessions by player name or username" data-message-placeholder="admin.sessions.search" data-translation-context-placeholder="Shown in the empty field that narrows the admin page's list of sessions down by the player's name or username" data-message-aria-label="admin.sessions.searchLabel" data-translation-context-aria-label="Name of the field that narrows the admin page's list of sessions down by the player's name or username, for screen readers" />
							<label data-message="admin.sessions.connected" data-translation-context="Label of the filter on the admin page's list of sessions for whether a session has a game, lobby or profile open now">
								Connected
								<select id="session-filter"></select>
							</label>
						</div>
						<p id="session-list-error" class="form-error" role="alert" hidden></p>
						<div class="admin-table-scroll">
							<table class="admin-table">
								<thead>
									<tr>
										<th scope="col" data-message="admin.column.player" data-translation-context="Heading of the column of players' names and usernames in the admin pages' lists of sessions and players">Player</th>
										<th scope="col" data-message="admin.sessions.started" data-translation-context="Heading of the column in the admin page's list of sessions for when the browser logged in">Logged in</th>
										<th scope="col" data-message="admin.sessions.lastUsed" data-translation-context="Heading of the column in the admin page's list of sessions for when the browser last used the site">Last used</th>
										<th scope="col" data-message="admin.sessions.ends" data-translation-context="Heading of the column in the admin page's list of sessions for when the login ends if the browser doesn't use the site again">Ends</th>
										<th scope="col" data-message="admin.column.notes" data-translation-context="Heading of the column in the admin pages' lists of sessions and players that says more about each, such as whether a session is connected now or a player is a server admin">Notes</th>
									</tr>
								</thead>
								<tbody id="session-rows"></tbody>
							</table>
						</div>
						<p id="session-loading" class="admin-loading" data-message="page.loading" data-translation-context="Shown while a page or part of one loads, such as the site settings, the choices in Create Character, an area in the editor, or a universe's page">Loading...</p>
						<p id="session-empty" class="universe-empty" data-message="admin.sessions.none" data-translation-context="Shown instead of the admin page's list of sessions when none match the search and filter" hidden>No sessions match.</p>
						<div class="pager">
							<button id="session-previous" type="button" class="secondary" data-message="pager.previous" data-translation-context="Button that shows the previous page of a list">Previous</button>
							<span id="session-page"></span>
							<button id="session-next" type="button" class="secondary" data-message="pager.next" data-translation-context="Button that shows the next page of a list">Next</button>
						</div>
					</div>
				</div>
			</section>
		</main>
		<!-- include footer.html -->
		<!-- include accessibility.html -->
		<script type="module" src="/src/adminSessions.ts"></script>
	</body>
</html>
