<!doctype html>
<html lang="en">
	<head>
		<!-- include head.html -->
		<title translate="no">%SITE_NAME%</title>
		<link rel="stylesheet" href="/src/style.scss" />
	</head>
	<body>
		<main>
			<!-- include status.html -->

			<section id="home-screen" class="screen" hidden>
				<header class="toolbar">
					<h1>
						<!-- include site-name.html -->
					</h1>
					<a class="button secondary toolbar-link" href="/admin" data-message="home.siteSettings" data-translation-context="Link in Home's toolbar to the page where the site's admins change settings for the whole site"><!-- icon ph:gear -->Site Settings</a>
					<a id="home-log-in" class="button toolbar-link" href="/login" data-message="home.logIn" data-translation-context="Link in Home's toolbar to the page for logging in or creating an account" hidden><!-- icon ph:sign-in -->Log in</a>
					<!-- include account.html -->
				</header>
				<p id="home-notice" class="notice" role="status" hidden></p>
				<img class="home-logo" src="/src/assets/layout/multiverse-kiln.png" alt="" width="256" height="256" />
				<div class="home-body">
					<div class="panel universes">
						<h2 data-message="home.universes" data-translation-context="Heading of the list of universes anyone can play">Universes</h2>
						<ul id="universe-list" class="universe-list"></ul>
						<p id="universe-empty" class="universe-empty" data-message="home.noUniverses" data-translation-context="Shown instead of the list of universes when there are none to play" hidden>There are no universes to play in yet.</p>
						<button id="universe-more" type="button" data-message="home.showMore" data-translation-context="Button that adds the next page of universes to the list" hidden>Show more</button>
					</div>
					<div id="own-universes" class="panel universes" hidden>
						<div class="panel-heading">
							<h2 data-message="home.ownUniverses" data-translation-context="Heading of the list of universes the player can edit">Your universes</h2>
							<button id="create-universe" type="button" data-shortcut="Alt+N" data-message="home.createUniverse" data-translation-context="Button that opens the dialog for making a new universe"><!-- icon ph:plus -->Create Universe</button>
						</div>
						<ul id="own-universe-list" class="universe-list"></ul>
						<p id="own-universe-empty" class="universe-empty" data-message="home.noOwnUniverses" data-translation-context="Shown instead of the list of universes the player can edit when there are none" hidden>You haven't made a universe yet.</p>
					</div>
				</div>
				<dialog id="create-universe-dialog" class="panel dialog" aria-labelledby="create-universe-title">
					<form id="create-universe-form" class="form">
						<h2 id="create-universe-title" data-message="home.create.title" data-translation-context="Title of the dialog for making a new universe">Create Universe</h2>
						<label data-message="form.name" data-translation-context="Label of the field for the name of something being made or edited, such as a universe, area, tile, item, race, class, theme or difficulty level, and the heading of the column of names in the editor's lists of them">
							Name
							<input id="create-universe-name" required />
						</label>
						<label data-message="universe.shortDescription" data-translation-context="Label of the field for a universe's description in one sentence">
							1-sentence description
							<input id="create-universe-description" />
						</label>
						<label data-message="universe.ruleset" data-translation-context="Label of the field for a universe's game rules, e.g. Pathfinder 1E">
							Ruleset
							<select id="create-universe-ruleset" required></select>
						</label>
						<p id="create-universe-error" class="form-error" role="alert" hidden></p>
						<div class="dialog-buttons">
							<button id="create-universe-cancel" type="button" class="secondary" data-message="dialog.cancel" data-translation-context="Button that closes a dialog without making any changes">Cancel</button>
							<button id="create-universe-submit" type="submit" aria-describedby="create-universe-error" data-shortcut="Alt+C" data-message="home.create.submit" data-translation-context="Button that makes the new universe">Create</button>
						</div>
					</form>
				</dialog>
			</section>
		</main>
		<!-- include footer.html -->
		<!-- include accessibility.html -->
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
