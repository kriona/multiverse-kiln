<dialog id="character-sheet-dialog" class="panel dialog character-sheet-dialog" aria-labelledby="character-sheet-title" aria-describedby="character-sheet-summary">
	<h2 id="character-sheet-title" tabindex="-1"></h2>
	<p id="character-sheet-summary" class="character-sheet-summary"></p>
	<p id="character-sheet-status" role="status"></p>
	<p id="character-sheet-error" class="form-error" role="alert" hidden></p>
	<p id="character-sheet-pending" class="notice character-sheet-notice" hidden></p>
	<div id="character-sheet-body" class="character-sheet" hidden>
		<section aria-labelledby="character-sheet-abilities-heading">
			<h3 id="character-sheet-abilities-heading" data-message="abilities.heading" data-translation-context="Heading of a character's six ability scores: on their sheet, and the part of Create Character where the player sets them">Ability scores</h3>
			<table class="character-sheet-abilities" aria-labelledby="character-sheet-abilities-heading">
				<thead>
					<tr>
						<th scope="col" data-message="abilities.ability" data-translation-context="Heading of the column naming each ability, such as Strength, on a character's sheet and in Create Character">Ability</th>
						<th scope="col" data-message="abilities.score" data-translation-context="Heading of the column of a character's ability scores, such as 16, on their sheet and in Create Character">Score</th>
						<th scope="col" data-message="abilities.modifier" data-translation-context="Heading of the column of the bonus or penalty each ability score gives, such as +2, on a character's sheet and in Create Character">Modifier</th>
					</tr>
				</thead>
				<tbody id="character-sheet-ability-rows"></tbody>
			</table>
		</section>
		<section aria-labelledby="character-sheet-traits-heading">
			<h3 id="character-sheet-traits-heading" data-message="characterSheet.traits" data-translation-context="Heading on a character's sheet of their size, their darkvision and light sensitivity, and their money">Traits</h3>
			<dl id="character-sheet-traits" class="character-sheet-traits"></dl>
		</section>
		<section aria-labelledby="character-sheet-equipped-heading">
			<h3 id="character-sheet-equipped-heading" data-message="characterSheet.equipped" data-translation-context="Heading on a character's sheet of their equipment slots, such as Head, Armor and Main hand, each with the item equipped in it or Empty">Equipped</h3>
			<dl id="character-sheet-equipped" class="character-sheet-traits character-sheet-equipped"></dl>
		</section>
		<section aria-labelledby="character-sheet-items-heading">
			<h3 id="character-sheet-items-heading" data-message="characterSheet.items" data-translation-context="Heading on a character's sheet of the items they carry">Equipment</h3>
			<ul id="character-sheet-items" class="character-sheet-items"></ul>
			<p id="character-sheet-no-items" class="character-sheet-none" data-message="characterSheet.noItems" data-translation-context="Shown on a character's sheet instead of their equipment when they carry no items" hidden>Carries nothing.</p>
		</section>
	</div>
	<div class="dialog-buttons character-sheet-buttons">
		<button id="character-sheet-delete" type="button" class="link-button character-sheet-delete" hidden data-message="characterSheet.delete" data-translation-context="Button on a character's sheet that starts deleting the character, asking first">Delete</button>
		<button id="character-sheet-leave" type="button" hidden data-shortcut="Alt+L"></button>
		<button id="character-sheet-restore" type="button" aria-describedby="character-sheet-pending" hidden data-shortcut="Alt+R" data-message="characterSheet.restore" data-translation-context="Button on the sheet of a character waiting to be deleted that takes back the deletion, so they can be played again"><!-- icon ph:arrow-counter-clockwise -->Restore</button>
		<button id="character-sheet-give" type="button" class="secondary" hidden data-shortcut="Alt+I" data-message="characterSheet.giveItems" data-translation-context="Button on a character's sheet, shown to the universe's creators from the editor's Character List tab, that opens the dialog for choosing items and how many of each to add to what the character carries"><!-- icon ph:gift -->Give Items</button>
		<button id="character-sheet-close" type="button" class="secondary" data-message="dialog.close" data-translation-context="Button that closes a dialog that only shows something, with nothing to change">Close</button>
	</div>
</dialog>
<dialog id="character-discard-dialog" class="panel dialog" aria-labelledby="character-discard-title" aria-describedby="character-discard-question character-discard-unequips">
	<form id="character-discard-form" class="form" novalidate>
		<h2 id="character-discard-title"></h2>
		<p id="character-discard-question"></p>
		<label id="character-discard-quantity-label">
			<span id="character-discard-quantity-text"></span>
			<input id="character-discard-quantity" type="number" min="1" step="1" required aria-describedby="character-discard-unequips" />
		</label>
		<p id="character-discard-unequips" class="hint" aria-live="polite" hidden></p>
		<p id="character-discard-error" class="form-error" role="alert" hidden></p>
		<div class="dialog-buttons">
			<button id="character-discard-cancel" type="button" class="secondary" data-message="dialog.cancel" data-translation-context="Button that closes a dialog without making any changes">Cancel</button>
			<button id="character-discard-confirm" type="submit" class="danger" aria-describedby="character-discard-error" data-message="characterSheet.discardConfirm" data-translation-context="Button, in the dialog that asks how many of an item to discard from what a character carries, that discards them at once"><!-- icon ph:trash -->Discard</button>
		</div>
	</form>
</dialog>
<dialog id="character-give-dialog" class="panel dialog" aria-labelledby="character-give-title">
	<form id="character-give-form" class="form" novalidate>
		<h2 id="character-give-title"></h2>
		<label>
			<span data-message="characterSheet.giveTo" data-translation-context="Label of the field, in the dialog opened by Give in an item's menu on a character's sheet, for which character in the group to give the item to">Give to</span>
			<select id="character-give-receiver" required></select>
		</label>
		<label id="character-give-quantity-label">
			<span id="character-give-quantity-text"></span>
			<input id="character-give-quantity" type="number" min="1" step="1" required aria-describedby="character-give-unequips" />
		</label>
		<p id="character-give-unequips" class="hint" aria-live="polite" hidden></p>
		<p id="character-give-error" class="form-error" role="alert" hidden></p>
		<div class="dialog-buttons">
			<button id="character-give-cancel" type="button" class="secondary" data-message="dialog.cancel" data-translation-context="Button that closes a dialog without making any changes">Cancel</button>
			<button id="character-give-confirm" type="submit" aria-describedby="character-give-error" data-shortcut="Alt+G" data-message="characterSheet.giveConfirm" data-translation-context="Button, in the dialog opened by Give in an item's menu on a character's sheet, that gives the item to the character chosen at once"><!-- icon ph:hand-arrow-up -->Give</button>
		</div>
	</form>
</dialog>
<dialog id="item-inspect-dialog" class="panel dialog item-inspect-dialog" aria-labelledby="item-inspect-title" aria-describedby="item-inspect-description">
	<h2 id="item-inspect-title" tabindex="-1"></h2>
	<dl id="item-inspect-details" class="character-sheet-traits item-inspect-details"></dl>
	<p id="item-inspect-description" class="item-inspect-description"></p>
	<div class="dialog-buttons">
		<button id="item-inspect-close" type="button" class="secondary" data-message="dialog.close" data-translation-context="Button that closes a dialog that only shows something, with nothing to change">Close</button>
	</div>
</dialog>
<dialog id="character-leave-dialog" class="panel dialog" aria-labelledby="character-leave-title" aria-describedby="character-leave-reason character-leave-question">
	<h2 id="character-leave-title"></h2>
	<p id="character-leave-reason" hidden></p>
	<p id="character-leave-question"></p>
	<p id="character-leave-error" class="form-error" role="alert" hidden></p>
	<div class="dialog-buttons">
		<button id="character-leave-cancel" type="button" data-message="dialog.cancel" data-translation-context="Button that closes a dialog without making any changes">Cancel</button>
		<button id="character-leave-confirm" type="button" class="danger" aria-describedby="character-leave-error"></button>
	</div>
</dialog>
<dialog id="character-delete-dialog" class="panel dialog" aria-labelledby="character-delete-title" aria-describedby="character-delete-question">
	<h2 id="character-delete-title" data-message="characterDelete.title" data-translation-context="Title of the dialog that asks whether to delete a character">Delete Character</h2>
	<p id="character-delete-question"></p>
	<div class="dialog-buttons">
		<button id="character-delete-cancel" type="button" class="secondary" data-message="dialog.cancel" data-translation-context="Button that closes a dialog without making any changes">Cancel</button>
		<button id="character-delete-confirm" type="button" class="danger" data-message="characterDelete.confirm" data-translation-context="Button in the dialog asking whether to delete a character that goes on to the last question before deleting them"><!-- icon ph:trash -->Delete</button>
	</div>
</dialog>
<dialog id="character-farewell-dialog" class="panel dialog character-farewell-dialog" aria-labelledby="character-farewell-title" aria-describedby="character-farewell-question">
	<h2 id="character-farewell-title" data-message="characterDelete.title" data-translation-context="Title of the dialog that asks whether to delete a character">Delete Character</h2>
	<p id="character-farewell-question"></p>
	<p id="character-farewell-error" class="form-error" role="alert" hidden></p>
	<div class="dialog-buttons character-farewell-buttons">
		<div class="character-farewell-delete-buttons">
			<button id="character-cremate" type="button" class="danger" aria-describedby="character-farewell-error" data-message="characterDelete.cremate" data-translation-context="Button that deletes a character immediately, for good. Cremate is a playful way of saying it (their body is burned); the words in parentheses say plainly what it does"><!-- icon game-icons:campfire -->Cremate (delete immediately)</button>
			<button id="character-last-rites" type="button" class="secondary" aria-describedby="character-farewell-error"></button>
		</div>
		<button id="character-farewell-cancel" type="button" data-message="characterDelete.mistake" data-translation-context="Button that closes the last question before deleting a character, the player's account or a universe, keeping it. A playful way of saying Cancel">I've Made A Terrible Mistake</button>
	</div>
</dialog>
