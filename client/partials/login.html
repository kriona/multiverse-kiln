<section id="login-screen" class="screen" hidden>
	<form id="login-form" class="panel login-panel">
		<h1 class="login-logo"><img src="/src/assets/layout/multiverse-kiln.png" alt="%SITE_NAME%" translate="no" width="256" height="256" /></h1>
		<label for="login-name" data-message="login.nameLabel" data-translation-context="Label of the login field where players type the name others will see">What should we call you?</label>
		<input id="login-name" name="name" autocomplete="nickname" required />
		<button id="login-submit" type="submit" data-message="login.submit" data-translation-context="Button that logs in with the name typed"><!-- icon ph:sign-in -->Enter</button>
	</form>
</section>
